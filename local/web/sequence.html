<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English TBI · Préparer une séquence</title><link rel="stylesheet" href="atelier.css"></head><body><header class="top"><div><span class="eyebrow">PRÉPARER</span><h1>Ma séquence</h1></div></header><main class="document-layout"><form id="editor" class="editor"><fieldset id="editor-fields" disabled><label>Titre de la séquence<input id="title" maxlength="120" required placeholder="Feelings — CP / CE1"></label><label>Niveau<input id="level" maxlength="80" placeholder="CP / CE1"></label><label>Objectif commun<textarea id="objective" maxlength="2000" rows="3"></textarea></label><label>État<select id="status"><option>À préparer</option><option>Prête</option><option>Réalisée</option></select></label><label>Notes de préparation<textarea id="notes" maxlength="10000" rows="4"></textarea></label><h2>Ressources communes</h2><p>Les séances de cette séquence retrouveront ces ressources, dans l’ordre choisi.</p><div id="resources"></div><div class="actions"><button class="primary" id="save">Enregistrer la séquence</button><a class="button" href="/">Retour à l’accueil</a></div><p id="message" role="status"></p></fieldset></form></main><script src="curriculum-ui.js"></script><script src="sequence.js"></script></body></html>
