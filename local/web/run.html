<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Déroulé de ma séance · English TBI</title>
    <link rel="stylesheet" href="atelier.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <span class="eyebrow">FAIRE CLASSE</span>
        <h1 id="title">Ma séance</h1>
        <p id="summary"></p>
      </div>
      <div id="actions" class="quick-actions"></div>
    </header>
    <main class="document-layout">
      <section class="editor">
        <p id="objective"></p>
        <p id="sentence" class="sentence-banner" hidden></p>
        <p id="instructions" class="pre-wrap"></p>
        <section id="stage-player" hidden>
          <div class="section-title">
            <h2 id="step-position"></h2>
            <div>
              <button id="previous" type="button">← Précédent</button>
              <button id="next" type="button">Suivant →</button>
            </div>
          </div>
          <div id="current-stage" class="current-stage"></div>
          <div id="stage-list" class="step-list"></div>
        </section>
        <details id="free-games" open>
          <summary>Choisir une activité</summary>
          <div id="games" class="launch-games"></div>
        </details>
        <details>
          <summary>Voir les cartes retenues</summary>
          <div id="cards" class="choices"></div>
        </details>
        <h2>Documents et liens</h2>
        <div id="shared"></div>
        <div id="resources"></div>
        <details id="success">
          <summary>Critères de réussite</summary>
          <p class="pre-wrap"></p>
        </details>
        <p id="message" role="status"></p>
      </section>
    </main>
    <script src="curriculum-ui.js"></script>
    <script src="run.js"></script>
  </body>
</html>
