<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>English TBI · Imprimer</title>
    <link rel="stylesheet" href="print.css" />
  </head>
  <body>
    <header class="toolbar">
      <a href="/">← Retour à l’atelier</a>
      <h1>Imprimer pour ma séance</h1>
      <p>
        Préparez vos feuilles A4, puis imprimez ou choisissez « Enregistrer au
        format PDF » dans la fenêtre d’impression.
      </p>
      <div class="settings">
        <label>Thème<select id="theme"></select></label
        ><label
          >Support<select id="kind">
            <option value="cards">Flashcards à découper</option>
            <option value="bingo">Grilles de loto</option>
            <option value="domino">Dominos image–mot</option>
            <option value="fold">Cartes à plier image / mot</option>
            <option value="book">Mini-livre à découper</option>
            <option value="worksheet">Fiche élève</option>
            <option value="cut">Cartes de manipulation</option>
            <option value="teacher">Planche enseignant</option>
            <option value="prep">Fiche de préparation</option>
          </select></label
        ><label id="layout-settings"
          >Format flashcards<select id="layout">
            <option value="class" selected>Élèves · planche économique</option>
            <option value="large">Grandes cartes collectives</option>
          </select></label
        ><label id="sets-settings"
          >Nombre de séries / élèves<input
            id="sets"
            type="number"
            min="1"
            max="40"
            value="2" /></label
        ><label id="cards-settings" hidden
          >Cartes par page<select id="per-page">
            <option>2</option>
            <option>4</option>
            <option selected>6</option>
            <option>8</option>
          </select></label
        ><label id="bingo-settings" hidden
          >Cases par grille<select id="grid-size">
            <option value="2,2">4 cases (2 × 2)</option>
            <option value="3,2" selected>6 cases (3 × 2)</option>
            <option value="3,3">9 cases (3 × 3)</option>
          </select></label
        ><label id="quantity-settings" hidden
          >Nombre de grilles<input
            id="quantity"
            type="number"
            min="1"
            max="30"
            value="6" /></label
        ><label id="exercise-settings" hidden
          >Exercice<select id="exercise">
            <option value="match">Relier les images aux mots</option>
            <option value="circle">Écouter et entourer</option>
            <option value="number">Numéroter sous la dictée</option>
            <option value="write">Écrire les mots</option>
          </select></label
        ><label class="checkbox"
          ><input id="show-label" type="checkbox" checked />Afficher les
          mots</label
        >
      </div>
      <p id="selection-note"></p>
      <p id="support-hint">
        Les cartes et la phrase modèle de votre séance sont reprises
        automatiquement.
      </p>
      <button id="generate">Préparer les pages</button>
      <button id="print" disabled>Imprimer / Enregistrer en PDF</button>
      <p id="status" role="status"></p>
    </header>
    <main id="preview" aria-label="Aperçu des pages à imprimer"></main>
    <script src="print.js"></script>
  </body>
</html>
